name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "python/**"
      - "tests/**"
      - "benchmarks/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  python-lint:
    name: Python lint (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Check the oldest and newest supported Python versions.
        python: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Create venv
        run: python -m venv .venv

      - name: Install tools
        run: |
          source .venv/bin/activate
          # Pinned so a new linter release can't fail CI on unrelated PRs.
          # Keep in sync with the dev dependency group in pyproject.toml.
          pip install ruff==0.14.13 ty==0.0.64 pytest pydantic opentelemetry-api

      - name: Ruff check
        run: |
          source .venv/bin/activate
          ruff check python/ tests/ benchmarks/

      - name: Ruff format
        run: |
          source .venv/bin/activate
          ruff format --check python/ tests/ benchmarks/

      - name: Type check (ty)
        run: |
          source .venv/bin/activate
          ty check python/pydynox/

  rust-lint:
    name: Rust lint
    runs-on: ubuntu-latest
    needs: python-lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust fmt
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test lock clock assumptions
        run: cargo test --locked --test lock_clock

  build:
    name: Build (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    needs: [rust-lint, python-lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          # Exercise the minimum build backend declared in pyproject.toml.
          maturin-version: "v1.14.0"
          command: build
          args: --release --locked --out dist -i python${{ matrix.python }}
          sccache: true

      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*.whl
          retention-days: 1

  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Download wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: dist

      - name: Create venv
        run: python -m venv .venv

      - name: Install wheel and dependencies
        run: |
          source .venv/bin/activate
          pip install dist/*.whl
          pip install pytest pytest-asyncio hypothesis pydantic opentelemetry-api opentelemetry-sdk

      - name: Verify wheel import
        run: |
          source .venv/bin/activate
          python -c "import pydynox; print(pydynox.version_info())"

      - name: Install integration test dependencies
        if: runner.os == 'Linux'
        run: |
          source .venv/bin/activate
          pip install testcontainers boto3

      - name: Run unit tests
        run: |
          source .venv/bin/activate
          pytest tests/unit/ -v

      - name: Run integration tests
        if: runner.os == 'Linux'
        run: |
          source .venv/bin/activate
          pytest tests/integration/ -v

