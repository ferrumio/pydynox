  #         python-version: "3.12"

  #     - name: Download wheel
  #       uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
  #       with:
  #         name: wheel-ubuntu-latest-py3.12
  #         path: dist

  #     - name: Create venv
  #       run: python -m venv .venv

  #     - name: Install wheel and dependencies
  #       run: |
  #         source .venv/bin/activate
  #         pip install dist/*.whl
  #         pip install pytest pytest-asyncio pytest-memray testcontainers boto3 opentelemetry-api opentelemetry-sdk

  #     - name: Run memory tests
  #       run: |
  #         source .venv/bin/activate
  #         pytest tests/memory/ -v --memray

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"

      - name: Download wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-ubuntu-latest-py3.15
          path: dist

      - name: Create venv
        run: python -m venv .venv

      - name: Install wheel and dependencies
        run: |
          source .venv/bin/activate
          pip install dist/*.whl
          pip install pytest pytest-asyncio coverage hypothesis testcontainers boto3 pydantic opentelemetry-api opentelemetry-sdk

      - name: Run tests with coverage
        run: |
          source .venv/bin/activate
          python -m coverage run --source=pydynox -m pytest tests/ -v --ignore=tests/benchmark --ignore=tests/memory
          python -m coverage xml

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
          env_vars: PYTHON
          name: pydynox-codecov
